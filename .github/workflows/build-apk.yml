name: Build installable Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Serial builds prevent simultaneous first-run signing-key creation.
concurrency:
  group: boali-android-google-maps-release-v1
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Debug APKs need a stable certificate or Android rejects future updates.
      # This is a CI-only debug key, NOT a production release signing key.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: boali-personal-debug-signer-v1
      - name: Create debug signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Install Android SDK directly
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Confirm cached signing key is readable
        shell: bash
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E 'SHA1:|SHA256:'
      - name: Unit tests
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Report actual APK signing certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
      - name: Build Android on-device route integration tests
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: gradle :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Upload on-device route tests
        uses: actions/upload-artifact@v4
        with:
          name: Boali-android-route-tests
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Create stable release signing key from GitHub secrets
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release.jks
      - name: Build signed APK for repeat updates (when secrets configured)
        env:
          RELEASE_KEYSTORE_FILE: release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Upload stable signed release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: LynBoaWalk-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LynBoaWalk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish a public direct-install APK download (no ZIP or login)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release view boali-android-latest >/dev/null 2>&1 || \
            gh release create boali-android-latest \
              --title "Boali · Latest Android APK" \
              --notes "Direct-install APK for Boali. Google Maps displays only when this build has the configured Google Maps SDK for Android API key. Routes remain stored locally." \
              --target "$GITHUB_SHA" --latest=false
          cp app/build/outputs/apk/debug/app-debug.apk Boali-Latest-Android.apk
          gh release upload boali-android-latest Boali-Latest-Android.apk --clobber

  launch-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: apk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LynBoaWalk-debug-apk
          path: ./built-apk
      - uses: actions/download-artifact@v4
        with:
          name: Boali-android-route-tests
          path: ./route-tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-launch test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            bash ci/smoke-test.sh
            adb shell am force-stop com.lynboa.walk
            adb install -r ./route-tests/app-debug-androidTest.apk
            adb shell am instrument -w com.lynboa.walk.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/boali-gps-tests.log
            grep -q 'OK (1 test)' /tmp/boali-gps-tests.log
